<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatterbox | Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===================== JOIN ===================== -->
    <main id="joinScreen" class="screen active">
        <section class="join-card">
            <svg class="mascot" viewBox="0 0 120 110" aria-hidden="true">
                <path
                    d="M20 10 H100 Q112 10 112 22 V66 Q112 78 100 78 H66 L46 100 L48 78 H20 Q8 78 8 66 V22 Q8 10 20 10 Z"
                    fill="#FFD23F" stroke="#1B1230" stroke-width="6" stroke-linejoin="round" />
                <ellipse cx="40" cy="40" rx="7" ry="10" fill="#1B1230" />
                <ellipse cx="80" cy="40" rx="7" ry="10" fill="#1B1230" />
                <circle cx="42" cy="35" r="3" fill="#fff" />
                <circle cx="82" cy="35" r="3" fill="#fff" />
                <circle cx="26" cy="56" r="6" fill="#FF6FA5" />
                <circle cx="94" cy="56" r="6" fill="#FF6FA5" />
                <path d="M46 55 Q60 68 74 55" fill="none" stroke="#1B1230" stroke-width="5" stroke-linecap="round" />
            </svg>

            <h1 class="logo">Chatterbox</h1>
            <p id="authTagline" class="tagline">Welcome back! Log in to jump in.</p>

            <div class="auth-tabs" role="tablist">
                <button id="tabLogin" class="auth-tab active" type="button" role="tab" aria-selected="true">Log
                    in</button>
                <button id="tabSignup" class="auth-tab" type="button" role="tab" aria-selected="false">Sign up</button>
            </div>

            <!-- Log in -->
            <form id="loginForm" autocomplete="off">
                <label for="loginUser">Username</label>
                <input id="loginUser" class="field" type="text" maxlength="16" placeholder="Your username" disabled>

                <label for="loginPass" class="gap">Password</label>
                <input id="loginPass" class="field" type="password" placeholder="Your password" disabled>

                <p id="loginError" class="error" role="alert" hidden></p>
                <div class="join-actions">
                    <span id="joinStatus" class="pill" data-state="connecting"><span class="dot"></span><span
                            class="txt">Connecting</span></span>
                    <button id="loginBtn" class="btn blue" type="submit" disabled>Log in</button>
                </div>
            </form>

            <!-- Sign up -->
            <form id="signupForm" autocomplete="off" hidden>
                <label for="signupUser">Username</label>
                <input id="signupUser" class="field" type="text" maxlength="16" placeholder="e.g. PixelPanda" disabled>
                <p class="hint">2 to 16 characters. The | symbol is not allowed.</p>

                <label for="signupPass" class="gap">Password</label>
                <input id="signupPass" class="field" type="password" placeholder="Pick a password" disabled>

                <label for="signupConfirm" class="gap">Confirm password</label>
                <input id="signupConfirm" class="field" type="password" placeholder="Type it again" disabled>

                <p id="signupError" class="error" role="alert" hidden></p>
                <div class="join-actions">
                    <button id="signupBtn" class="btn blue" type="submit" disabled>Create account</button>
                </div>
            </form>
        </section>
    </main>

    <!-- ===================== CONSOLE ===================== -->
    <aside id="console" class="console" aria-label="Connection console">
        <div class="console-bar">
            <span id="consoleGrip" class="console-grip" role="button" tabindex="0"
                aria-label="Move console. Drag it, or use the arrow keys. Press Escape to reset."
                title="Drag to move. Double-click to reset."></span>
            <button id="consoleToggle" class="console-toggle" type="button" aria-expanded="false"
                aria-controls="consoleBody" aria-label="Console" title="Console">
                <span class="term-icon" aria-hidden="true">&gt;_</span>
                <span class="chev" aria-hidden="true">&#9650;</span>
                <span class="lbl">Console</span>
            </button>
            <button id="consoleClear" class="console-clear" type="button">Clear</button>
        </div>
        <div id="consoleBody" class="console-body" role="log" inert></div>
    </aside>

    <script src="common.js"></script>
    <script src="login.js"></script>
</body>

</html>
