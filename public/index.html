<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatterbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

    <style>
        /* ------------------------------------------------------------
           PALETTE
           Primary:        Bubble Blue, Sunny Yellow
           Secondary:      Mint Green, Bubblegum Pink, Sky Cyan
           Complementary:  Orange (opposite blue), Purple (opposite yellow)
           Neutrals:       Ink (outlines), Paper (background), White
        ------------------------------------------------------------ */
        :root {
            --blue: #2D6BFF;
            --yellow: #FFD23F;
            --green: #35D07F;
            --pink: #FF6FA5;
            --sky: #5CCBFF;
            --orange: #FF8A2B;
            --purple: #8B5CF6;

            --ink: #1B1230;
            --paper: #FFF6DF;
            --white: #FFFFFF;

            --line: 4px;
            --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
            --body: "Nunito", "Segoe UI", system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: var(--body);
            font-weight: 600;
            font-size: 16px;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(rgba(27, 18, 48, .13) 2px, transparent 2.5px);
            background-size: 26px 26px;
        }

        :focus-visible {
            outline: 4px solid var(--purple);
            outline-offset: 3px;
        }

        .screen { display: none; height: 100dvh; }
        .screen.active { display: flex; }

        /* ---------- shared pieces ---------- */
        .btn {
            font-family: var(--display);
            font-size: 20px;
            letter-spacing: .5px;
            color: var(--ink);
            background: var(--yellow);
            border: 3px solid var(--ink);
            border-radius: 16px;
            padding: 10px 22px 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, .45);
            transform: translateY(0);
            transition: transform .08s, box-shadow .08s;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, .45); }
        .btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, .45); }
        .btn:disabled { background: #D9D2C3; color: #7d7590; cursor: not-allowed; box-shadow: 0 6px 0 var(--ink); }
        .btn.blue { background: var(--blue); color: var(--white); }
        .btn.small { font-size: 16px; padding: 6px 14px 8px; box-shadow: 0 4px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, .45); }

        .field {
            font: inherit;
            font-weight: 800;
            width: 100%;
            padding: 12px 16px;
            color: var(--ink);
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 14px;
            box-shadow: inset 0 5px 0 rgba(27, 18, 48, .12);
        }
        .field::placeholder { color: #8d84a3; font-weight: 600; }
        .field:disabled { background: #EEE8D8; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 14px;
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 999px;
            padding: 3px 12px 3px 8px;
        }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); background: var(--orange); }
        .pill[data-state="online"] .dot { background: var(--green); }
        .pill[data-state="connecting"] .dot { background: var(--yellow); }

        .avatar {
            flex: none;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            font-family: var(--display);
            font-size: 20px;
            color: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 50%;
            box-shadow: 0 4px 0 var(--ink), inset 0 -5px 0 rgba(27, 18, 48, .18), inset 3px 3px 0 rgba(255, 255, 255, .5);
        }

        /* ---------- JOIN SCREEN ---------- */
        #joinScreen { align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }

        .join-card {
            position: relative;
            width: min(440px, 100%);
            margin-top: 56px;
            padding: 64px 28px 30px;
            background: var(--white);
            border: var(--line) solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both;
        }
        @keyframes pop { from { transform: scale(.7) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }

        .mascot {
            position: absolute;
            top: -62px;
            left: 50%;
            width: 120px;
            transform: translateX(-50%) rotate(-5deg);
            filter: drop-shadow(5px 5px 0 var(--ink));
        }

        .logo {
            margin: 0 0 6px;
            text-align: center;
            font-family: var(--display);
            font-weight: 400;
            font-size: 54px;
            line-height: 1;
            color: var(--blue);
            -webkit-text-stroke: 6px var(--ink);
            paint-order: stroke fill;
            text-shadow: 0 5px 0 var(--ink);
        }
        .tagline { margin: 0 0 22px; text-align: center; font-weight: 800; }

        .join-card label { display: block; margin-bottom: 8px; font-weight: 800; }
        .hint { margin: 8px 0 0; font-size: 14px; color: #5b5273; }

        .error {
            margin: 14px 0 0;
            padding: 10px 14px;
            font-weight: 800;
            background: var(--pink);
            border: 3px solid var(--ink);
            border-radius: 14px;
            box-shadow: 4px 4px 0 var(--ink);
        }
        .error[hidden] { display: none; }

        .join-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
        .join-actions .btn { flex: 1; }

        /* ---------- CHAT SCREEN ---------- */
        #chatScreen { flex-direction: column; }

        .topbar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--yellow);
            border-bottom: var(--line) solid var(--ink);
            box-shadow: 0 5px 0 rgba(27, 18, 48, .25);
            z-index: 3;
        }
        .topbar h1 {
            margin: 0;
            font-family: var(--display);
            font-weight: 400;
            font-size: 30px;
            line-height: 1;
            color: var(--white);
            -webkit-text-stroke: 5px var(--ink);
            paint-order: stroke fill;
            text-shadow: 0 4px 0 var(--ink);
        }
        .topbar .spacer { flex: 1; }
        .who-btn { display: none; }

        .body { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 260px; }

        .log {
            min-height: 0;
            overflow-y: auto;
            padding: 20px 18px 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .empty {
            margin: auto;
            max-width: 320px;
            padding: 18px 20px;
            text-align: center;
            font-weight: 800;
            background: var(--white);
            border: 3px dashed var(--ink);
            border-radius: 20px;
        }

        .row { display: flex; align-items: flex-end; gap: 10px; animation: slide .18s ease-out both; }
        @keyframes slide { from { transform: translateY(8px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
        .row.mine { flex-direction: row-reverse; }

        .stack { display: flex; flex-direction: column; gap: 6px; max-width: min(72%, 560px); }
        .row.mine .stack { align-items: flex-end; }

        .meta { display: flex; align-items: baseline; gap: 8px; padding: 0 6px; font-size: 14px; }
        .meta b { font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .3px; }
        .meta time { font-size: 12px; color: #5b5273; }

        .bubble {
            padding: 10px 16px 12px;
            font-weight: 700;
            line-height: 1.35;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            color: var(--ink);
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 20px 20px 20px 5px;
            box-shadow: 5px 5px 0 var(--ink), inset 0 -4px 0 rgba(27, 18, 48, .08);
        }
        .row.mine .bubble {
            color: var(--white);
            background: var(--blue);
            border-radius: 20px 20px 5px 20px;
            box-shadow: 5px 5px 0 var(--ink), inset 0 -5px 0 rgba(0, 0, 40, .25), inset 0 4px 0 rgba(255, 255, 255, .25);
        }

        .sys {
            align-self: center;
            padding: 4px 14px 5px;
            font-size: 14px;
            font-weight: 800;
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 4px 0 var(--ink);
        }

        .panel {
            min-height: 0;
            overflow-y: auto;
            padding: 18px;
            background: var(--sky);
            border-left: var(--line) solid var(--ink);
        }
        .panel h2 { margin: 0 0 16px; font-family: var(--display); font-weight: 400; font-size: 24px; }
        .panel ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
        .panel li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 6px 6px;
            font-weight: 800;
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 4px 0 var(--ink);
            overflow-wrap: anywhere;
        }
        .panel li .avatar { width: 34px; height: 34px; font-size: 17px; box-shadow: 0 3px 0 var(--ink), inset 0 -4px 0 rgba(27, 18, 48, .18), inset 2px 2px 0 rgba(255, 255, 255, .5); }
        .you { margin-left: auto; font-size: 12px; padding: 1px 8px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px; }

        .composer {
            flex: none;
            display: flex;
            gap: 12px;
            padding: 14px 16px 18px;
            background: var(--white);
            border-top: var(--line) solid var(--ink);
        }

        /* ---------- small screens ---------- */
        @media (max-width: 760px) {
            .body { grid-template-columns: 1fr; }
            .who-btn { display: inline-block; }
            .panel {
                position: absolute;
                top: 0;
                right: 0;
                bottom: 0;
                width: min(280px, 82%);
                transform: translateX(110%);
                transition: transform .2s ease-out;
                z-index: 2;
            }
            .panel.open { transform: none; box-shadow: -8px 0 0 rgba(27, 18, 48, .25); }
            .stack { max-width: 80%; }
            .topbar h1 { font-size: 24px; }
            .logo { font-size: 44px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>

    <!-- ===================== JOIN ===================== -->
    <main id="joinScreen" class="screen active">
        <section class="join-card">
            <svg class="mascot" viewBox="0 0 120 110" aria-hidden="true">
                <path d="M20 10 H100 Q112 10 112 22 V66 Q112 78 100 78 H66 L46 100 L48 78 H20 Q8 78 8 66 V22 Q8 10 20 10 Z"
                    fill="#FFD23F" stroke="#1B1230" stroke-width="6" stroke-linejoin="round" />
                <ellipse cx="40" cy="40" rx="7" ry="10" fill="#1B1230" />
                <ellipse cx="80" cy="40" rx="7" ry="10" fill="#1B1230" />
                <circle cx="42" cy="35" r="3" fill="#fff" />
                <circle cx="82" cy="35" r="3" fill="#fff" />
                <circle cx="26" cy="56" r="6" fill="#FF6FA5" />
                <circle cx="94" cy="56" r="6" fill="#FF6FA5" />
                <path d="M46 55 Q60 68 74 55" fill="none" stroke="#1B1230" stroke-width="5" stroke-linecap="round" />
            </svg>

            <h1 class="logo">Chatterbox</h1>
            <p class="tagline">Pick a name and jump in.</p>

            <form id="joinForm" autocomplete="off">
                <label for="nameInput">Username</label>
                <input id="nameInput" class="field" type="text" maxlength="16" placeholder="e.g. PixelPanda" disabled>
                <p class="hint">2 to 16 characters. Don't use | or ,</p>
                <p id="joinError" class="error" role="alert" hidden></p>

                <div class="join-actions">
                    <span id="joinStatus" class="pill" data-state="connecting"><span class="dot"></span><span class="txt">Connecting</span></span>
                    <button id="joinBtn" class="btn blue" type="submit" disabled>Join chat</button>
                </div>
            </form>
        </section>
    </main>

    <!-- ===================== CHAT ===================== -->
    <div id="chatScreen" class="screen">
        <header class="topbar">
            <h1>Chatterbox</h1>
            <span id="chatStatus" class="pill" data-state="connecting"><span class="dot"></span><span class="txt">Connecting</span></span>
            <span class="spacer"></span>
            <button id="whoBtn" class="btn small who-btn" type="button" aria-expanded="false" aria-controls="panel">Who's here</button>
        </header>

        <div class="body">
            <div id="log" class="log" role="log" aria-live="polite">
                <div id="empty" class="empty">It's quiet in here. Say hi!</div>
            </div>

            <aside id="panel" class="panel" aria-label="People online">
                <h2>Online (<span id="count">0</span>)</h2>
                <ul id="users"></ul>
            </aside>
        </div>

        <form id="chatForm" class="composer" autocomplete="off">
            <input id="msgInput" class="field" type="text" aria-label="Message" placeholder="Type a message" maxlength="500" disabled>
            <button id="sendBtn" class="btn" type="submit" disabled>Send</button>
        </form>
    </div>

    <script>
        // ---------- connection ----------
        const wsUrl = location.protocol.indexOf("http") === 0
            ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host
            : "ws://localhost:8000";

        const AVATAR_COLORS = ["#35D07F", "#FF6FA5", "#5CCBFF", "#FF8A2B", "#8B5CF6"];

        const $ = (id) => document.getElementById(id);
        const joinScreen = $("joinScreen"), chatScreen = $("chatScreen");
        const nameInput = $("nameInput"), joinBtn = $("joinBtn"), joinError = $("joinError");
        const msgInput = $("msgInput"), sendBtn = $("sendBtn");
        const logEl = $("log"), usersEl = $("users"), countEl = $("count");
        const panel = $("panel"), whoBtn = $("whoBtn");

        let socket = null;
        let myName = "";        // name the server accepted
        let pendingName = "";   // name we asked for and are waiting on
        let joined = false;
        let retryTimer = null;

        function setStatus(state) {
            const label = { online: "Connected", connecting: "Connecting", offline: "Offline" }[state];
            [$("joinStatus"), $("chatStatus")].forEach((el) => {
                el.dataset.state = state;
                el.querySelector(".txt").textContent = label;
            });
            const online = state === "online";
            nameInput.disabled = !online;
            joinBtn.disabled = !online;
            msgInput.disabled = !(online && joined);
            sendBtn.disabled = !(online && joined);
        }

        function connect() {
            setStatus("connecting");
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                clearTimeout(retryTimer);
                setStatus("online");
                if (joined || myName) {
                    // connection dropped earlier: claim the same name again
                    pendingName = myName;
                    socket.send(myName);
                    joined = false;
                    setStatus("online");
                } else {
                    nameInput.focus();
                }
            };

            socket.onmessage = (event) => handle(String(event.data));

            socket.onclose = () => {
                const wasJoined = joined;
                joined = false;
                setStatus("offline");
                if (wasJoined) addSystem("Connection lost. Trying to reconnect...");
                retryTimer = setTimeout(connect, 2000);
            };

            socket.onerror = () => { /* onclose handles the retry */ };
        }

        // ---------- protocol ----------
        function handle(data) {
            const i = data.indexOf("|");
            const type = i < 0 ? data : data.slice(0, i);
            const rest = i < 0 ? "" : data.slice(i + 1);

            if (type === "OK") {
                myName = rest;
                joined = true;
                joinError.hidden = true;
                showScreen("chat");
                setStatus("online");
                msgInput.focus();
                return;
            }
            if (type === "ERR") {
                myName = "";
                joined = false;
                showScreen("join");
                joinError.textContent = rest;
                joinError.hidden = false;
                nameInput.focus();
                return;
            }
            if (!joined) return; // ignore broadcasts until we have a name

            if (type === "SYS") addSystem(rest);
            else if (type === "USERS") renderUsers(rest === "" ? [] : rest.split(","));
            else if (type === "MSG") {
                const j = rest.indexOf("|");
                addMessage(rest.slice(0, j), rest.slice(j + 1));
            }
        }

        // ---------- UI helpers ----------
        function showScreen(name) {
            joinScreen.classList.toggle("active", name === "join");
            chatScreen.classList.toggle("active", name === "chat");
        }

        function colorFor(name) {
            let sum = 0;
            for (let c = 0; c < name.length; c++) sum += name.charCodeAt(c);
            return AVATAR_COLORS[sum % AVATAR_COLORS.length];
        }

        function makeAvatar(name) {
            const a = document.createElement("div");
            a.className = "avatar";
            a.style.background = colorFor(name);
            a.textContent = name.charAt(0).toUpperCase();
            return a;
        }

        function nearBottom() {
            return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 120;
        }

        function push(node, force) {
            const stick = force || nearBottom();
            const empty = $("empty");
            if (empty) empty.remove();
            logEl.appendChild(node);
            if (stick) logEl.scrollTop = logEl.scrollHeight;
        }

        function addSystem(text) {
            const s = document.createElement("div");
            s.className = "sys";
            s.textContent = text;
            push(s, false);
        }

        function addMessage(name, text) {
            const mine = name === myName;

            const row = document.createElement("div");
            row.className = "row" + (mine ? " mine" : "");

            const stack = document.createElement("div");
            stack.className = "stack";

            const meta = document.createElement("div");
            meta.className = "meta";
            const who = document.createElement("b");
            who.textContent = mine ? "You" : name;
            const time = document.createElement("time");
            time.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            meta.append(who, time);

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            stack.append(meta, bubble);
            row.append(makeAvatar(name), stack);
            push(row, mine);
        }

        function renderUsers(list) {
            list.sort((a, b) => a.localeCompare(b));
            countEl.textContent = list.length;
            usersEl.replaceChildren();
            list.forEach((name) => {
                const li = document.createElement("li");
                const label = document.createElement("span");
                label.textContent = name;
                li.append(makeAvatar(name), label);
                if (name === myName) {
                    const tag = document.createElement("span");
                    tag.className = "you";
                    tag.textContent = "you";
                    li.append(tag);
                }
                usersEl.appendChild(li);
            });
        }

        // ---------- events ----------
        $("joinForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            if (name.length < 2) return showJoinError("Username needs at least 2 characters.");
            if (/[|,]/.test(name)) return showJoinError("Usernames can't contain | or ,");
            if (!socket || socket.readyState !== WebSocket.OPEN) return showJoinError("Not connected yet. Wait for the green dot.");
            joinError.hidden = true;
            pendingName = name;
            socket.send(name);
        });

        function showJoinError(text) {
            joinError.textContent = text;
            joinError.hidden = false;
            nameInput.focus();
        }

        $("chatForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text || !joined || socket.readyState !== WebSocket.OPEN) return;
            socket.send(text);
            msgInput.value = "";
            msgInput.focus();
        });

        whoBtn.addEventListener("click", () => {
            const open = panel.classList.toggle("open");
            whoBtn.setAttribute("aria-expanded", open);
        });

        connect();
    </script>
</body>

</html>
