<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatterbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

    <style>
        /* ------------------------------------------------------------
           PALETTE
           Primary:        Bubble Blue, Sunny Yellow
           Secondary:      Mint Green, Bubblegum Pink, Sky Cyan
           Complementary:  Orange (opposite blue), Purple (opposite yellow)
           Neutrals:       Ink (outlines), Paper (background), White
        ------------------------------------------------------------ */
        :root {
            --blue: #2D6BFF;
            --yellow: #FFD23F;
            --green: #35D07F;
            --pink: #FF6FA5;
            --sky: #5CCBFF;
            --orange: #FF8A2B;
            --purple: #8B5CF6;

            --ink: #1B1230;
            --paper: #FFF6DF;
            --white: #FFFFFF;

            --line: 4px;
            --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
            --body: "Nunito", "Segoe UI", system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: var(--body);
            font-weight: 600;
            font-size: 16px;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(rgba(27, 18, 48, .13) 2px, transparent 2.5px);
            background-size: 26px 26px;
        }

        :focus-visible {
            outline: 4px solid var(--purple);
            outline-offset: 3px;
        }

        .screen { display: none; height: 100dvh; }
        .screen.active { display: flex; }

        /* ---------- shared pieces ---------- */
        .btn {
            font-family: var(--display);
            font-size: 20px;
            letter-spacing: .5px;
            color: var(--ink);
            background: var(--yellow);
            border: 3px solid var(--ink);
            border-radius: 16px;
            padding: 10px 22px 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, .45);
            transform: translateY(0);
            transition: transform .08s, box-shadow .08s;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, .45); }
        .btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, .45); }
        .btn:disabled { background: #D9D2C3; color: #7d7590; cursor: not-allowed; box-shadow: 0 6px 0 var(--ink); }
        .btn.blue { background: var(--blue); color: var(--white); }
        .btn.small { font-size: 16px; padding: 6px 14px 8px; box-shadow: 0 4px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, .45); }

        .field {
            font: inherit;
            font-weight: 800;
            width: 100%;
            padding: 12px 16px;
            color: var(--ink);
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 14px;
            box-shadow: inset 0 5px 0 rgba(27, 18, 48, .12);
        }
        .field::placeholder { color: #8d84a3; font-weight: 600; }
        .field:disabled { background: #EEE8D8; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 14px;
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 999px;
            padding: 3px 12px 3px 8px;
        }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); background: var(--orange); }
        .pill[data-state="online"] .dot { background: var(--green); }
        .pill[data-state="connecting"] .dot { background: var(--yellow); }

        .avatar {
            flex: none;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            font-family: var(--display);
            font-size: 20px;
            color: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 50%;
            box-shadow: 0 4px 0 var(--ink), inset 0 -5px 0 rgba(27, 18, 48, .18), inset 3px 3px 0 rgba(255, 255, 255, .5);
        }

        /* ---------- JOIN SCREEN ---------- */
        #joinScreen { align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }

        .join-card {
            position: relative;
            width: min(440px, 100%);
            margin-top: 56px;
            padding: 64px 28px 30px;
            background: var(--white);
            border: var(--line) solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both;
        }
        @keyframes pop { from { transform: scale(.7) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }

        .mascot {
            position: absolute;
            top: -62px;
            left: 50%;
            width: 120px;
            transform: translateX(-50%) rotate(-5deg);
            filter: drop-shadow(5px 5px 0 var(--ink));
        }

        .logo {
            margin: 0 0 6px;
            text-align: center;
            font-family: var(--display);
            font-weight: 400;
            font-size: 54px;
            line-height: 1;
            color: var(--blue);
            -webkit-text-stroke: 6px var(--ink);
            paint-order: stroke fill;
            text-shadow: 0 5px 0 var(--ink);
        }
        .tagline { margin: 0 0 22px; text-align: center; font-weight: 800; }

        .join-card label { display: block; margin-bottom: 8px; font-weight: 800; }
        .hint { margin: 8px 0 0; font-size: 14px; color: #5b5273; }

        .error {
            margin: 14px 0 0;
            padding: 10px 14px;
            font-weight: 800;
            background: var(--pink);
            border: 3px solid var(--ink);
            border-radius: 14px;
            box-shadow: 4px 4px 0 var(--ink);
        }
        .error[hidden] { display: none; }

        .join-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
        .join-actions .btn { flex: 1; }

        /* ---------- CHAT SCREEN (Discord-style layout) ---------- */
        #chatScreen { flex-direction: row; }

        /* left: channels */
        .channels {
            flex: none;
            width: 264px;
            display: flex;
            flex-direction: column;
            background: var(--yellow);
            border-right: var(--line) solid var(--ink);
            z-index: 3;
        }
        .brand { flex: none; padding: 16px 18px 14px; border-bottom: var(--line) solid var(--ink); box-shadow: inset 0 -4px 0 rgba(255, 255, 255, .35); }
        .brand h1 {
            margin: 0;
            font-family: var(--display);
            font-weight: 400;
            font-size: 32px;
            line-height: 1;
            color: var(--white);
            -webkit-text-stroke: 5px var(--ink);
            paint-order: stroke fill;
            text-shadow: 0 4px 0 var(--ink);
        }
        .chan-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 14px; }
        .section { margin: 0 0 12px 6px; font-family: var(--display); font-weight: 400; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
        .channel-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .channel {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 9px;
            font-family: var(--body);
            font-weight: 800;
            font-size: 16px;
            text-align: left;
            color: var(--ink);
            background: transparent;
            border: 3px solid transparent;
            border-radius: 14px;
            cursor: pointer;
        }
        .channel .hash { font-family: var(--display); font-size: 20px; line-height: 1; opacity: .6; }
        .channel .cname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .channel:hover { background: rgba(255, 255, 255, .6); border-color: var(--ink); }
        .channel.unread .cname { font-weight: 800; }
        .channel.unread:not(.active) .cname { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
        .channel .badge {
            min-width: 24px;
            padding: 0 7px 1px;
            font-family: var(--display);
            font-size: 14px;
            line-height: 20px;
            text-align: center;
            color: var(--ink);
            background: var(--pink);
            border: 3px solid var(--ink);
            border-radius: 999px;
        }
        .channel .badge[hidden] { display: none; }
        .channel .udot { width: 12px; height: 12px; background: var(--white); border: 3px solid var(--ink); border-radius: 50%; }
        .channel .udot[hidden] { display: none; }
        .channel.active {
            color: var(--white);
            background: var(--blue);
            border-color: var(--ink);
            box-shadow: 0 5px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, .3);
        }
        .channel.active .hash { opacity: 1; }

        .usercard {
            flex: none;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 12px 14px;
            padding: 8px 12px 8px 8px;
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 18px;
            box-shadow: 0 5px 0 var(--ink);
        }
        .usercard .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .usercard .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
        .usercard .pill { align-self: flex-start; font-size: 12px; padding: 0 9px 0 5px; }
        .usercard .dot { width: 11px; height: 11px; border-width: 2px; }

        /* middle: chat */
        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        .chanbar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--white);
            border-bottom: var(--line) solid var(--ink);
            box-shadow: 0 5px 0 rgba(27, 18, 48, .2);
            z-index: 2;
        }
        .chanbar h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; }
        .chanbar .hash { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--purple); }
        .chanbar .topic { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 12px; border-left: 3px solid var(--ink); font-size: 14px; color: #5b5273; }
        .chanbar .spacer { flex: 1; }
        .nav-btn { display: none; }

        .log {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 18px 28px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .welcome {
            margin: 0 0 8px;
            padding: 18px 20px 20px;
            background: var(--white);
            border: 3px dashed var(--ink);
            border-radius: 22px;
        }
        .welcome .big {
            display: grid;
            place-items: center;
            width: 56px;
            height: 56px;
            margin-bottom: 10px;
            font-family: var(--display);
            font-size: 34px;
            color: var(--white);
            background: var(--purple);
            border: 3px solid var(--ink);
            border-radius: 50%;
            box-shadow: 0 4px 0 var(--ink), inset 0 -5px 0 rgba(27, 18, 48, .2);
        }
        .welcome h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 26px; }
        .welcome p { margin: 0; font-weight: 700; color: #5b5273; }

        .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 6px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 3px; background: var(--ink); border-radius: 3px; }
        .divider span { padding: 2px 14px 3px; font-size: 13px; font-weight: 800; background: var(--white); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); }

        .msg {
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr);
            column-gap: 14px;
            padding: 3px 8px;
            margin: 0 -8px;
            border-radius: 16px;
            animation: slide .18s ease-out both;
        }
        @keyframes slide { from { transform: translateY(8px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
        .msg.head { margin-top: 14px; }
        .msg.cont { margin-top: 2px; }
        .msg.mention { background: rgba(255, 210, 63, .45); box-shadow: inset 5px 0 0 var(--orange); }
        .gutter { position: relative; }
        .gutter time { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 11px; color: #5b5273; opacity: 0; }
        .msg.cont:hover .gutter time { opacity: 1; }
        .content { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }

        .meta { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; }
        .meta b { font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: .3px; }
        .meta time { font-size: 12px; color: #5b5273; }

        .bubble {
            max-width: min(100%, 640px);
            padding: 9px 15px 11px;
            font-weight: 700;
            line-height: 1.35;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            color: var(--ink);
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 18px 18px 18px 6px;
            box-shadow: 5px 5px 0 var(--ink), inset 0 -4px 0 rgba(27, 18, 48, .08);
        }
        .msg.mine .bubble {
            color: var(--white);
            background: var(--blue);
            box-shadow: 5px 5px 0 var(--ink), inset 0 -5px 0 rgba(0, 0, 40, .25), inset 0 4px 0 rgba(255, 255, 255, .25);
        }
        .mention-tag { padding: 0 6px 1px; font-weight: 800; color: var(--ink); background: var(--sky); border: 2px solid var(--ink); border-radius: 8px; }
        .mention-tag.me { background: var(--yellow); }

        .sys {
            align-self: center;
            margin: 10px 0 2px;
            padding: 4px 14px 5px;
            font-size: 14px;
            font-weight: 800;
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 4px 0 var(--ink);
            animation: slide .18s ease-out both;
        }

        .typing {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            margin: 14px 0 0 54px; /* lines up with message bubbles */
            animation: slide .18s ease-out both;
        }
        .typing[hidden] { display: none; }
        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 13px 18px;
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 18px 18px 18px 6px;
            box-shadow: 5px 5px 0 var(--ink), inset 0 -4px 0 rgba(27, 18, 48, .08);
        }
        .typing-bubble i {
            width: 11px;
            height: 11px;
            border: 2px solid var(--ink);
            border-radius: 50%;
            background: var(--blue);
            animation: dotbounce 1s ease-in-out infinite;
        }
        .typing-bubble i:nth-child(2) { background: var(--pink); animation-delay: .15s; }
        .typing-bubble i:nth-child(3) { background: var(--green); animation-delay: .3s; }
        @keyframes dotbounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        .typing small { padding-left: 6px; font-size: 13px; font-weight: 800; color: #5b5273; }

        .composer {
            flex: none;
            display: flex;
            gap: 12px;
            padding: 14px 16px 18px;
            background: var(--white);
            border-top: var(--line) solid var(--ink);
        }

        /* right: members */
        .panel {
            flex: none;
            width: 250px;
            min-height: 0;
            overflow-y: auto;
            padding: 18px;
            background: var(--sky);
            border-left: var(--line) solid var(--ink);
            z-index: 3;
        }
        .panel h2 { margin: 0 0 16px 4px; font-family: var(--display); font-weight: 400; font-size: 22px; }
        .panel ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
        .member {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 6px 6px;
            font: inherit;
            font-weight: 800;
            text-align: left;
            color: var(--ink);
            background: var(--white);
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 4px 0 var(--ink);
            overflow-wrap: anywhere;
            cursor: pointer;
        }
        .member:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
        .member:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
        .member .avatar { width: 34px; height: 34px; font-size: 17px; box-shadow: 0 3px 0 var(--ink), inset 0 -4px 0 rgba(27, 18, 48, .18), inset 2px 2px 0 rgba(255, 255, 255, .5); }
        .you { margin-left: auto; font-size: 12px; padding: 1px 8px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px; }

        .scrim { display: none; }

        /* ---------- small screens: side columns become drawers ---------- */
        @media (max-width: 900px) {
            .nav-btn { display: inline-block; }
            .chanbar .topic { display: none; }
            .channels, .panel {
                position: fixed;
                top: 0;
                bottom: 0;
                width: min(290px, 84vw);
                z-index: 20;
                transition: transform .2s ease-out;
            }
            .channels { left: 0; transform: translateX(-110%); }
            .panel { right: 0; transform: translateX(110%); }
            .channels.open, .panel.open { transform: none; }
            .scrim.show { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(27, 18, 48, .45); }
            .logo { font-size: 44px; }
            .chanbar h2 { font-size: 22px; }
        }

        /* ---------- connection console (bottom left) ---------- */
        .console {
            position: fixed;
            left: 14px;
            bottom: 14px;
            z-index: 10;
            width: min(430px, calc(100vw - 28px));
            overflow: hidden;
            background: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 16px;
            box-shadow: 0 6px 0 var(--ink);
        }
        .console-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 8px 4px 4px;
            background: var(--purple);
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, .3);
        }
        .console-bar { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
        .console.dragging { box-shadow: 0 10px 0 var(--ink); }
        .console.dragging .console-bar { cursor: grabbing; }
        .console-grip {
            flex: none;
            width: 18px;
            height: 24px;
            margin-left: 6px;
            border-radius: 6px;
            background-image: radial-gradient(var(--white) 2px, transparent 2.5px);
            background-size: 6px 8px;
            background-position: 2px 1px;
            opacity: .9;
        }
        .console-toggle {
            flex: 1;
            justify-content: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            font-family: var(--display);
            font-size: 17px;
            letter-spacing: .4px;
            color: var(--white);
            background: transparent;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
        }
        .console-toggle .chev { display: inline-block; font-size: 12px; transition: transform .15s; }
        .console.open .console-toggle .chev { transform: rotate(180deg); }
        .console-clear {
            font-family: var(--display);
            font-size: 14px;
            padding: 2px 12px 3px;
            color: var(--ink);
            background: var(--white);
            border: 2px solid var(--ink);
            border-radius: 999px;
            cursor: pointer;
        }
        .console:not(.open) .console-clear { display: none; }
        .console-body {
            max-height: min(220px, 35dvh);
            overflow-y: auto;
            padding: 10px 12px;
            font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #F4EFFF;
        }
        .console-body[hidden] { display: none; }
        .console-body .cl { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
        .console-body .tag { font-weight: 800; }
        .t-sys { color: var(--yellow); }
        .t-srv { color: var(--green); }
        .t-cli { color: var(--sky); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>

    <!-- ===================== JOIN ===================== -->
    <main id="joinScreen" class="screen active">
        <section class="join-card">
            <svg class="mascot" viewBox="0 0 120 110" aria-hidden="true">
                <path d="M20 10 H100 Q112 10 112 22 V66 Q112 78 100 78 H66 L46 100 L48 78 H20 Q8 78 8 66 V22 Q8 10 20 10 Z"
                    fill="#FFD23F" stroke="#1B1230" stroke-width="6" stroke-linejoin="round" />
                <ellipse cx="40" cy="40" rx="7" ry="10" fill="#1B1230" />
                <ellipse cx="80" cy="40" rx="7" ry="10" fill="#1B1230" />
                <circle cx="42" cy="35" r="3" fill="#fff" />
                <circle cx="82" cy="35" r="3" fill="#fff" />
                <circle cx="26" cy="56" r="6" fill="#FF6FA5" />
                <circle cx="94" cy="56" r="6" fill="#FF6FA5" />
                <path d="M46 55 Q60 68 74 55" fill="none" stroke="#1B1230" stroke-width="5" stroke-linecap="round" />
            </svg>

            <h1 class="logo">Chatterbox</h1>
            <p class="tagline">Pick a name and jump in.</p>

            <form id="joinForm" autocomplete="off">
                <label for="nameInput">Username</label>
                <input id="nameInput" class="field" type="text" maxlength="16" placeholder="e.g. PixelPanda" disabled>
                <p class="hint">2 to 16 characters. The | symbol is not allowed.</p>
                <p id="joinError" class="error" role="alert" hidden></p>

                <div class="join-actions">
                    <span id="joinStatus" class="pill" data-state="connecting"><span class="dot"></span><span class="txt">Connecting</span></span>
                    <button id="joinBtn" class="btn blue" type="submit" disabled>Join chat</button>
                </div>
            </form>
        </section>
    </main>

    <!-- ===================== CHAT ===================== -->
    <div id="chatScreen" class="screen">
        <nav id="channels" class="channels" aria-label="Channels">
            <div class="brand"><h1>Chatterbox</h1></div>
            <div class="chan-scroll">
                <h2 class="section">Text channels</h2>
                <ul id="channelList" class="channel-list"></ul>
            </div>
            <div class="usercard">
                <div id="meAvatar" class="avatar"></div>
                <div class="who">
                    <b id="meName"></b>
                    <span id="chatStatus" class="pill" data-state="connecting"><span class="dot"></span><span class="txt">Connecting</span></span>
                </div>
            </div>
        </nav>

        <section class="main">
            <header class="chanbar">
                <button id="chanBtn" class="btn small nav-btn" type="button" aria-expanded="false" aria-controls="channels">Channels</button>
                <span class="hash" aria-hidden="true">#</span>
                <h2 id="chanName">general</h2>
                <span id="chanTopic" class="topic"></span>
                <span class="spacer"></span>
                <button id="whoBtn" class="btn small nav-btn" type="button" aria-expanded="false" aria-controls="panel">Who's here</button>
            </header>

            <div id="log" class="log" role="log" aria-live="polite">
                <div id="welcome" class="welcome">
                    <div class="big" aria-hidden="true">#</div>
                    <h3 id="welcomeTitle"></h3>
                    <p id="welcomeText"></p>
                </div>
                <div id="typing" class="typing" hidden>
                    <div class="typing-bubble" aria-hidden="true"><i></i><i></i><i></i></div>
                    <small id="typingText"></small>
                </div>
            </div>

            <form id="chatForm" class="composer" autocomplete="off">
                <input id="msgInput" class="field" type="text" aria-label="Message" placeholder="Message #general" maxlength="300" disabled>
                <button id="sendBtn" class="btn" type="submit" disabled>Send</button>
            </form>
        </section>

        <aside id="panel" class="panel" aria-label="People online">
            <h2>Online (<span id="count">0</span>)</h2>
            <ul id="users"></ul>
        </aside>

        <div id="scrim" class="scrim"></div>
    </div>

    <!-- ===================== CONSOLE ===================== -->
    <aside id="console" class="console" aria-label="Connection console">
        <div class="console-bar">
            <span id="consoleGrip" class="console-grip" role="button" tabindex="0"
                aria-label="Move console. Drag it, or use the arrow keys. Press Escape to reset."
                title="Drag to move. Double-click to reset."></span>
            <button id="consoleToggle" class="console-toggle" type="button" aria-expanded="false" aria-controls="consoleBody">
                <span class="chev" aria-hidden="true">&#9650;</span> Console
            </button>
            <button id="consoleClear" class="console-clear" type="button">Clear</button>
        </div>
        <div id="consoleBody" class="console-body" role="log" hidden></div>
    </aside>

    <script>
        // ---------- connection ----------
        const wsUrl = location.protocol.indexOf("http") === 0
            ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host
            : "ws://localhost:8000";

        const AVATAR_COLORS = ["#35D07F", "#FF6FA5", "#5CCBFF", "#FF8A2B", "#8B5CF6"];
        const CLAIM_MS = 700;        // how long we wait for "taken" replies
        const HEARTBEAT_MS = 20000;  // how often we say "still here"
        const STALE_MS = 150000;     // forget people we haven't heard from
        const TYPING_REFRESH_MS = 2500; // how often we repeat "I'm typing"
        const TYPING_IDLE_MS = 3000;    // stop saying it after this much silence
        const TYPING_TTL_MS = 5000;     // hide someone's dots if we hear nothing for this long
        const GROUP_MS = 5 * 60 * 1000; // messages from one person within 5 minutes are grouped

        // The channels are fixed. Add or rename them here.
        const CHANNELS = [
            { id: "general", topic: "Say hi and hang out" },
            { id: "random", topic: "Anything goes" },
            { id: "help", topic: "Stuck on something? Ask here" },
            { id: "memes", topic: "Only the good stuff" }
        ];

        const $ = (id) => document.getElementById(id);
        const joinScreen = $("joinScreen"), chatScreen = $("chatScreen");
        const nameInput = $("nameInput"), joinBtn = $("joinBtn"), joinError = $("joinError");
        const msgInput = $("msgInput"), sendBtn = $("sendBtn");
        const logEl = $("log"), usersEl = $("users"), countEl = $("count");
        const panel = $("panel"), whoBtn = $("whoBtn"), chanBtn = $("chanBtn");
        const channelsEl = $("channels"), channelList = $("channelList"), scrim = $("scrim");
        const chanNameEl = $("chanName"), chanTopicEl = $("chanTopic");
        const welcomeEl = $("welcome"), welcomeTitle = $("welcomeTitle"), welcomeText = $("welcomeText");
        const typingEl = $("typing"), typingText = $("typingText");
        const consoleEl = $("console"), consoleBody = $("consoleBody"), consoleToggle = $("consoleToggle");

        // ---------- console (shows what travels over the socket) ----------
        const PACKET_TYPES = ["CLAIM", "TAKEN", "HELLO", "HERE", "BYE", "MSG", "TYPING"];
        const QUIET_TYPES = ["TYPING"];   // packets too chatty to list in the console
        let warnedUnknown = false;
        const TAG_CLASS = { System: "t-sys", Server: "t-srv", Client: "t-cli" };

        function logLine(tag, text) {
            try { writeLine(tag, text); } catch (err) { /* logging must never break the chat */ }
        }

        function writeLine(tag, text) {
            const stick = consoleBody.scrollHeight - consoleBody.scrollTop - consoleBody.clientHeight < 40;
            const line = document.createElement("span");
            line.className = "cl";
            const label = document.createElement("b");
            label.className = "tag " + TAG_CLASS[tag];
            label.textContent = "[" + tag + "]";
            line.append(label, " " + text);
            consoleBody.appendChild(line);
            while (consoleBody.childElementCount > 200) consoleBody.firstElementChild.remove();
            if (stick) consoleBody.scrollTop = consoleBody.scrollHeight;
        }

        // Position state (declared before placeConsole uses it)
        const POS_KEY = "chatterbox.console";
        let userPlaced = false;   // true once the console has been dragged somewhere
        let drag = null;
        let suppressClick = false;

        // Keep the console just above the message box on the chat screen,
        // unless the user has moved it somewhere else.
        function placeConsole() {
            if (userPlaced) { clampConsole(); return; }
            const bar = $("chatForm");
            const chatOn = chatScreen.classList.contains("active");
            const lift = chatOn ? bar.offsetHeight : 0;
            // On wide screens, start just right of the channel column.
            const wide = window.matchMedia ? window.matchMedia("(min-width: 901px)").matches : false;
            const side = chatOn && wide ? channelsEl.offsetWidth : 0;
            consoleEl.style.left = (side + 14) + "px";
            consoleEl.style.bottom = (lift + 14) + "px";
        }
        window.addEventListener("resize", placeConsole);
        if (window.ResizeObserver) new ResizeObserver(placeConsole).observe($("chatForm"));

        consoleToggle.addEventListener("click", () => {
            if (suppressClick) return; // this click was the end of a drag
            const open = consoleEl.classList.toggle("open");
            consoleBody.hidden = !open;
            consoleToggle.setAttribute("aria-expanded", open);
            if (open) consoleBody.scrollTop = consoleBody.scrollHeight;
            if (userPlaced) clampConsole(); // opening makes it taller: keep it on screen
        });
        $("consoleClear").addEventListener("click", () => consoleBody.replaceChildren());

        // ---------- draggable console ----------
        const consoleBar = consoleEl.querySelector(".console-bar");
        const consoleGrip = $("consoleGrip");

        // Keep the whole window inside the browser window.
        function clampConsole() {
            const r = consoleEl.getBoundingClientRect();
            const left = Math.min(Math.max(0, r.left), Math.max(0, window.innerWidth - r.width));
            const top = Math.min(Math.max(0, r.top), Math.max(0, window.innerHeight - r.height));
            consoleEl.style.left = left + "px";
            consoleEl.style.top = top + "px";
        }

        function setConsolePos(left, top) {
            userPlaced = true;
            consoleEl.style.left = left + "px";
            consoleEl.style.top = top + "px";
            consoleEl.style.bottom = "auto";
            clampConsole();
        }

        function savePos() {
            try {
                const r = consoleEl.getBoundingClientRect();
                localStorage.setItem(POS_KEY, JSON.stringify({ left: r.left, top: r.top }));
            } catch (err) { /* storage unavailable: position just won't be remembered */ }
        }

        function resetPos() {
            userPlaced = false;
            consoleEl.style.left = "";
            consoleEl.style.top = "";
            try { localStorage.removeItem(POS_KEY); } catch (err) { }
            placeConsole();
        }

        function onDragMove(e) {
            if (!drag) return;
            if (!drag.moved) {
                // ignore tiny wiggles so a normal click still toggles the console
                if (Math.abs(e.clientX - drag.startX) < 4 && Math.abs(e.clientY - drag.startY) < 4) return;
                drag.moved = true;
                consoleEl.classList.add("dragging");
            }
            setConsolePos(e.clientX - drag.offX, e.clientY - drag.offY);
        }

        function onDragEnd() {
            window.removeEventListener("pointermove", onDragMove);
            window.removeEventListener("pointerup", onDragEnd);
            window.removeEventListener("pointercancel", onDragEnd);
            if (drag && drag.moved) {
                consoleEl.classList.remove("dragging");
                suppressClick = true;
                setTimeout(() => { suppressClick = false; }, 80);
                savePos();
            }
            drag = null;
        }

        consoleBar.addEventListener("pointerdown", (e) => {
            if (e.button > 0 || e.target.closest("#consoleClear")) return;
            const r = consoleEl.getBoundingClientRect();
            drag = { offX: e.clientX - r.left, offY: e.clientY - r.top, startX: e.clientX, startY: e.clientY, moved: false };
            window.addEventListener("pointermove", onDragMove);
            window.addEventListener("pointerup", onDragEnd);
            window.addEventListener("pointercancel", onDragEnd);
        });

        // Keyboard: arrow keys move it (Shift for bigger steps), Escape or double-click resets it.
        consoleGrip.addEventListener("keydown", (e) => {
            if (e.key === "Escape" || e.key === "Home") { e.preventDefault(); resetPos(); return; }
            const step = e.shiftKey ? 60 : 20;
            const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
            if (!move) return;
            e.preventDefault();
            const r = consoleEl.getBoundingClientRect();
            setConsolePos(r.left + move[0], r.top + move[1]);
            savePos();
        });
        consoleGrip.addEventListener("dblclick", resetPos);

        // Remember where it was last time.
        try {
            const saved = JSON.parse(localStorage.getItem(POS_KEY) || "null");
            if (saved && isFinite(saved.left) && isFinite(saved.top)) setConsolePos(saved.left, saved.top);
        } catch (err) { }

        // Every tab gets its own id, so two people can never be confused.
        const myId = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);

        let socket = null;
        let retryTimer = null;
        let retryDelay = 1000;
        let state = "connecting";
        let joined = false;
        let myName = "";
        let claim = null;            // { name, timer } while we wait to see if a name is free
        const peers = new Map();     // id -> { name, seen }
        const typers = new Map();    // id -> { name, ch, timer }  (people typing right now)
        let iAmTyping = false;
        let typingChannel = "general";
        let typingSentAt = 0;
        let typingIdleTimer = null;

        // Channel state. Every browser receives every message and keeps its own copy.
        const store = {};            // channel id -> { items: [], unread: 0, mentions: 0 }
        const drafts = {};           // channel id -> unsent text in the message box
        let current = "general";
        CHANNELS.forEach((c) => { store[c.id] = { items: [], unread: 0, mentions: 0 }; drafts[c.id] = ""; });

        const same = (a, b) => a.toLowerCase() === b.toLowerCase();

        function setStatus(next) {
            state = next;
            const label = { online: "Connected", connecting: "Connecting", offline: "Offline" }[state];
            [$("joinStatus"), $("chatStatus")].forEach((el) => {
                el.dataset.state = state;
                el.querySelector(".txt").textContent = label;
            });
            const online = state === "online";
            const checking = claim !== null;
            nameInput.disabled = !online || checking;
            joinBtn.disabled = !online || checking;
            joinBtn.textContent = checking ? "Checking..." : "Join chat";
            msgInput.disabled = !(online && joined);
            sendBtn.disabled = !(online && joined);
        }

        // Every packet looks like  TYPE|id|name|payload
        // For MSG the payload is  channel|text   and for TYPING it is  channel|1  or  channel|0
        function sendPacket(type, id, name, payload) {
            return sendRaw(type + "|" + id + "|" + name + "|" + (payload || ""));
        }

        function sendRaw(text) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(text);
                const m = parse(text);
                if (QUIET_TYPES.indexOf(m.type) < 0) {
                    if (m.type === "MSG") {
                        const msg = splitPayload(m.payload);
                        logLine("Client", "#" + msg.ch + " " + msg.text);
                    } else {
                        logLine("Client", text);
                    }
                }
                return true;
            }
            return false;
        }

        function parse(data) {
            const parts = [];
            let rest = data;
            for (let i = 0; i < 3; i++) {
                const k = rest.indexOf("|");
                if (k < 0) { parts.push(rest); rest = ""; continue; }
                parts.push(rest.slice(0, k));
                rest = rest.slice(k + 1);
            }
            parts.push(rest);
            return { type: parts[0], id: parts[1], name: parts[2], payload: parts[3] };
        }

        // "random|hello"  ->  { ch: "random", text: "hello" }
        // No known channel in front (older page)  ->  #general
        function splitPayload(payload) {
            const k = payload.indexOf("|");
            if (k > 0) {
                const ch = payload.slice(0, k);
                if (store[ch]) return { ch, text: payload.slice(k + 1) };
            }
            return { ch: "general", text: payload };
        }

        function connect() {
            setStatus("connecting");
            logLine("System", "Connecting to " + wsUrl + " ...");
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                clearTimeout(retryTimer);
                retryDelay = 1000;
                logLine("System", "Handshake complete. WebSocket ready.");
                setStatus("online");
                if (joined) {
                    // Connection came back: tell everyone we're still here.
                    resetPeers();
                    sendPacket("HELLO", myId, myName, "re");
                    addSystem("Reconnected.", current);
                } else {
                    nameInput.focus();
                }
            };

            socket.onmessage = (event) => {
                let data = String(event.data);

                // The original lab server wraps every message as "User <n> says: <text>".
                // Unwrap it so the chat still works if that server is running.
                const wrapped = /^User \d+ says: ([\s\S]*)$/.exec(data);
                if (wrapped) data = wrapped[1];

                const m = parse(data);
                if (QUIET_TYPES.indexOf(m.type) < 0) {
                    if (m.type === "MSG") {
                        const msg = splitPayload(m.payload);
                        logLine("Server", m.name + " says in #" + msg.ch + ": " + msg.text);
                    } else {
                        logLine("Server", data);
                    }
                }

                if (PACKET_TYPES.indexOf(m.type) < 0) {
                    if (!warnedUnknown) {
                        warnedUnknown = true;
                        logLine("System", "Ignored a message that isn't a Chatterbox packet. If the chat stays empty, make sure the server is running the new app.bzg.");
                    }
                    return;
                }
                handle(data);
            };

            socket.onclose = () => {
                if (claim) { clearTimeout(claim.timer); claim = null; }
                cancelTyping();
                clearAllTypers();
                setStatus("offline");
                logLine("System", "Connection closed. Retrying in " + (retryDelay / 1000) + "s ...");
                if (joined) addSystem("Connection lost. Trying to reconnect...", current);
                retryTimer = setTimeout(connect, retryDelay);
                retryDelay = Math.min(retryDelay * 2, 10000);
            };

            socket.onerror = () => logLine("System", "Connection error.");
        }

        // ---------- protocol ----------
        function handle(data) {
            const m = parse(data);

            // Username checks work before we have joined.
            if (m.type === "CLAIM") {
                if (m.id === myId) return;
                const owner = joined && same(m.name, myName);
                // If two people claim the same name at once, the lower id wins.
                const tie = claim && same(m.name, claim.name) && myId < m.id;
                if (owner || tie) sendPacket("TAKEN", m.id, m.name, "");
                return;
            }
            if (m.type === "TAKEN") {
                if (claim && m.id === myId && same(m.name, claim.name)) failClaim();
                return;
            }

            if (!joined) return;

            if (m.type === "HELLO") {
                addPeer(m.id, m.name);
                if (m.payload !== "re") addSystem(m.name + " joined the chat", "general");
                if (m.id !== myId) sendPacket("HERE", myId, myName, "");
            } else if (m.type === "HERE") {
                addPeer(m.id, m.name);
            } else if (m.type === "TYPING") {
                if (m.id !== myId) {
                    const t = splitPayload(m.payload);
                    setTyper(m.id, m.name, t.ch, t.text === "1");
                }
            } else if (m.type === "BYE") {
                clearTyper(m.id);
                if (peers.delete(m.id)) {
                    renderUsers();
                    addSystem(m.name + " left the chat", "general");
                }
            } else if (m.type === "MSG") {
                const msg = splitPayload(m.payload);
                clearTyper(m.id);
                addPeer(m.id, m.name);
                receiveMessage(msg.ch, m.id, m.name, msg.text);
            }
        }

        function resetPeers() {
            clearAllTypers();
            peers.clear();
            peers.set(myId, { name: myName, seen: Date.now() });
            renderUsers();
        }

        function addPeer(id, name) {
            const known = peers.get(id);
            peers.set(id, { name, seen: Date.now() });
            if (!known || known.name !== name) renderUsers();
        }

        // ---------- typing indicator (per channel) ----------
        // What we send: TYPING|id|name|channel|1 while typing, channel|0 when we stop.
        function stopTyping() {
            clearTimeout(typingIdleTimer);
            if (iAmTyping) {
                iAmTyping = false;
                sendPacket("TYPING", myId, myName, typingChannel + "|0");
            }
        }

        // Used after sending a message or losing the connection: others hide our dots
        // on their own, so no extra packet is needed.
        function cancelTyping() {
            clearTimeout(typingIdleTimer);
            iAmTyping = false;
        }

        msgInput.addEventListener("input", () => {
            if (!joined) return;
            if (iAmTyping && typingChannel !== current) stopTyping();
            if (msgInput.value.trim() === "") { stopTyping(); return; }
            const now = Date.now();
            if (!iAmTyping || now - typingSentAt > TYPING_REFRESH_MS) {
                typingChannel = current;
                sendPacket("TYPING", myId, myName, current + "|1");
                typingSentAt = now;
                iAmTyping = true;
            }
            clearTimeout(typingIdleTimer);
            typingIdleTimer = setTimeout(stopTyping, TYPING_IDLE_MS);
        });

        // What we receive
        function setTyper(id, name, ch, on) {
            const existed = typers.get(id);
            if (existed) clearTimeout(existed.timer);
            if (!on) {
                if (existed) { typers.delete(id); renderTyping(); }
                return;
            }
            typers.set(id, { name, ch, timer: setTimeout(() => clearTyper(id), TYPING_TTL_MS) });
            if (!existed || existed.name !== name || existed.ch !== ch) renderTyping();
        }

        function clearTyper(id) {
            const t = typers.get(id);
            if (!t) return;
            clearTimeout(t.timer);
            typers.delete(id);
            renderTyping();
        }

        function clearAllTypers() {
            typers.forEach((t) => clearTimeout(t.timer));
            typers.clear();
            renderTyping();
        }

        function typingLabel(names) {
            if (names.length === 1) return names[0] + " is typing";
            if (names.length === 2) return names[0] + " and " + names[1] + " are typing";
            if (names.length === 3) return names[0] + ", " + names[1] + " and " + names[2] + " are typing";
            return "Several people are typing";
        }

        // Only people typing in the channel you are looking at are shown.
        function renderTyping() {
            const names = Array.from(typers.values()).filter((t) => t.ch === current).map((t) => t.name);
            if (names.length === 0) {
                typingEl.hidden = true;
                return;
            }
            const stick = nearBottom();
            typingText.textContent = typingLabel(names);
            typingEl.hidden = false;
            if (stick) logEl.scrollTop = logEl.scrollHeight;
        }

        function startClaim(name) {
            claim = { name, timer: setTimeout(finishClaim, CLAIM_MS) };
            joinError.hidden = true;
            setStatus(state);
            sendPacket("CLAIM", myId, name, "");
        }

        function failClaim() {
            clearTimeout(claim.timer);
            claim = null;
            setStatus(state);
            showJoinError("That username is taken. Try another one.");
        }

        function finishClaim() {
            if (!claim) return;
            myName = claim.name;
            claim = null;
            joined = true;
            logLine("System", "Username accepted. Joined as " + myName + ".");
            $("meName").textContent = myName;
            $("meAvatar").style.background = colorFor(myName);
            $("meAvatar").textContent = myName.charAt(0).toUpperCase();
            resetPeers();
            showScreen("chat");
            setStatus(state);
            sendPacket("HELLO", myId, myName, "");
            msgInput.focus();
        }

        // Say "still here" now and then, and forget people who went quiet.
        setInterval(() => {
            if (!joined) return;
            sendPacket("HERE", myId, myName, "");
            const now = Date.now();
            peers.forEach((p, id) => {
                if (id !== myId && now - p.seen > STALE_MS) {
                    peers.delete(id);
                    addSystem(p.name + " left the chat", "general");
                }
            });
            renderUsers();
        }, HEARTBEAT_MS);

        // Best effort goodbye when the tab closes.
        window.addEventListener("pagehide", () => {
            if (joined) sendPacket("BYE", myId, myName, "");
        });

        // ---------- UI helpers ----------
        function showScreen(name) {
            joinScreen.classList.toggle("active", name === "join");
            chatScreen.classList.toggle("active", name === "chat");
            placeConsole();
        }

        function colorFor(name) {
            let sum = 0;
            for (let c = 0; c < name.length; c++) sum += name.charCodeAt(c);
            return AVATAR_COLORS[sum % AVATAR_COLORS.length];
        }

        function makeAvatar(name) {
            const a = document.createElement("div");
            a.className = "avatar";
            a.style.background = colorFor(name);
            a.textContent = name.charAt(0).toUpperCase();
            return a;
        }

        function nearBottom() {
            return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 120;
        }

        // ---------- channels ----------
        function buildChannelList() {
            CHANNELS.forEach((c) => {
                const li = document.createElement("li");
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "channel";
                btn.dataset.ch = c.id;
                const hash = document.createElement("span");
                hash.className = "hash";
                hash.textContent = "#";
                const name = document.createElement("span");
                name.className = "cname";
                name.textContent = c.id;
                const dot = document.createElement("span");
                dot.className = "udot";
                dot.hidden = true;
                const badge = document.createElement("span");
                badge.className = "badge";
                badge.hidden = true;
                btn.append(hash, name, dot, badge);
                btn.addEventListener("click", () => switchChannel(c.id));
                li.append(btn);
                channelList.append(li);
            });
        }

        function updateBadges() {
            channelList.querySelectorAll(".channel").forEach((btn) => {
                const ch = btn.dataset.ch;
                const box = store[ch];
                const active = ch === current;
                btn.classList.toggle("active", active);
                btn.classList.toggle("unread", !active && box.unread > 0);
                btn.querySelector(".udot").hidden = active || box.unread === 0 || box.mentions > 0;
                const badge = btn.querySelector(".badge");
                badge.hidden = active || box.mentions === 0;
                badge.textContent = box.mentions;
                if (active) btn.setAttribute("aria-current", "page"); else btn.removeAttribute("aria-current");
                let label = "#" + ch;
                if (!active && box.unread) label += ", " + box.unread + " unread";
                if (!active && box.mentions) label += ", " + box.mentions + " mentions";
                btn.setAttribute("aria-label", label);
            });
        }

        function channelInfo(id) {
            return CHANNELS.find((c) => c.id === id);
        }

        function renderChannelHeader() {
            const info = channelInfo(current);
            chanNameEl.textContent = current;
            chanTopicEl.textContent = info.topic;
            msgInput.placeholder = "Message #" + current;
            welcomeTitle.textContent = "Welcome to #" + current;
            welcomeText.textContent = "This is the start of the #" + current + " channel. " + info.topic + ".";
        }

        function renderChannel() {
            const items = store[current].items;
            const nodes = [];
            items.forEach((item, i) => buildNodes(item, items[i - 1]).forEach((n) => nodes.push(n)));
            logEl.replaceChildren(welcomeEl, ...nodes, typingEl);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function switchChannel(ch) {
            if (ch === current) { closeDrawers(); return; }
            stopTyping();                       // we were typing in the old channel
            drafts[current] = msgInput.value;   // keep what was typed, per channel
            current = ch;
            msgInput.value = drafts[ch] || "";
            store[ch].unread = 0;
            store[ch].mentions = 0;
            updateBadges();
            renderChannelHeader();
            renderChannel();
            renderTyping();
            closeDrawers();
            if (!msgInput.disabled) msgInput.focus();
        }

        // ---------- messages ----------
        const dayKey = (ts) => {
            const d = new Date(ts);
            return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
        };

        function dayLabel(ts) {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if (dayKey(ts) === dayKey(Date.now())) return "Today";
            if (dayKey(ts) === dayKey(yesterday.getTime())) return "Yesterday";
            return new Date(ts).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
        }

        const timeLabel = (ts) => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

        function mentionsMe(text) {
            const safe = myName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            return new RegExp("(^|[^\\w])@" + safe + "(?![\\w])", "i").test(text);
        }

        // Writes text into an element, turning @names of people who are online into tags.
        function appendText(el, text) {
            const names = Array.from(peers.values()).map((p) => p.name).sort((a, b) => b.length - a.length);
            let buf = "";
            let i = 0;
            while (i < text.length) {
                if (text[i] === "@" && (i === 0 || !/\w/.test(text[i - 1]))) {
                    const hit = names.find((n) =>
                        text.substr(i + 1, n.length).toLowerCase() === n.toLowerCase() &&
                        !/\w/.test(text.charAt(i + 1 + n.length)));
                    if (hit) {
                        if (buf) { el.append(buf); buf = ""; }
                        const tag = document.createElement("span");
                        tag.className = "mention-tag" + (same(hit, myName) ? " me" : "");
                        tag.textContent = text.substr(i, hit.length + 1);
                        el.append(tag);
                        i += hit.length + 1;
                        continue;
                    }
                }
                buf += text[i];
                i++;
            }
            if (buf) el.append(buf);
        }

        function makeDivider(ts) {
            const d = document.createElement("div");
            d.className = "divider";
            const label = document.createElement("span");
            label.textContent = dayLabel(ts);
            d.append(label);
            return d;
        }

        function makeSystem(item) {
            const s = document.createElement("div");
            s.className = "sys";
            s.textContent = item.text;
            return s;
        }

        function makeMessage(item, grouped) {
            const mine = item.id === myId;
            const row = document.createElement("div");
            row.className = "msg " + (grouped ? "cont" : "head") + (mine ? " mine" : "") + (item.mention ? " mention" : "");

            const gutter = document.createElement("div");
            gutter.className = "gutter";
            const content = document.createElement("div");
            content.className = "content";

            if (grouped) {
                const t = document.createElement("time");
                t.textContent = timeLabel(item.ts);
                gutter.append(t);
            } else {
                gutter.append(makeAvatar(item.name));
                const meta = document.createElement("div");
                meta.className = "meta";
                const who = document.createElement("b");
                who.textContent = item.name;
                const time = document.createElement("time");
                time.textContent = timeLabel(item.ts);
                meta.append(who, time);
                content.append(meta);
            }

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            appendText(bubble, item.text);
            content.append(bubble);

            row.append(gutter, content);
            return row;
        }

        // One item can become several nodes: an optional date divider, then the item.
        function buildNodes(item, prev) {
            const nodes = [];
            const newDay = !prev || dayKey(prev.ts) !== dayKey(item.ts);
            if (newDay) nodes.push(makeDivider(item.ts));
            if (item.kind === "sys") {
                nodes.push(makeSystem(item));
                return nodes;
            }
            const grouped = !newDay && prev.kind === "msg" && prev.id === item.id && item.ts - prev.ts < GROUP_MS;
            nodes.push(makeMessage(item, grouped));
            return nodes;
        }

        function addItem(ch, item) {
            const box = store[ch];
            const prev = box.items[box.items.length - 1];
            box.items.push(item);
            if (box.items.length > 500) {
                box.items.splice(0, 100);
                if (ch === current) renderChannel();
                return;
            }
            if (ch !== current) return;
            const stick = item.id === myId || nearBottom();
            buildNodes(item, prev).forEach((n) => logEl.insertBefore(n, typingEl)); // typing bubble stays last
            if (stick) logEl.scrollTop = logEl.scrollHeight;
        }

        function addSystem(text, ch) {
            addItem(ch || "general", { kind: "sys", text, ts: Date.now() });
        }

        function receiveMessage(ch, id, name, text) {
            const mine = id === myId;
            const mention = !mine && mentionsMe(text);
            addItem(ch, { kind: "msg", id, name, text, ts: Date.now(), mention });
            if (!mine && ch !== current) {
                store[ch].unread++;
                if (mention) store[ch].mentions++;
                updateBadges();
            }
        }

        // ---------- members ----------
        function insertMention(name) {
            const v = msgInput.value;
            msgInput.value = v + (v && !/\s$/.test(v) ? " " : "") + "@" + name + " ";
            msgInput.focus();
            msgInput.dispatchEvent(new Event("input", { bubbles: true }));
        }

        function renderUsers() {
            const list = Array.from(peers.entries()).sort((a, b) => a[1].name.localeCompare(b[1].name));
            countEl.textContent = list.length;
            usersEl.replaceChildren();
            list.forEach(([id, p]) => {
                const li = document.createElement("li");
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "member";
                const label = document.createElement("span");
                label.textContent = p.name;
                btn.append(makeAvatar(p.name), label);
                if (id === myId) {
                    const tag = document.createElement("span");
                    tag.className = "you";
                    tag.textContent = "you";
                    btn.append(tag);
                    btn.title = "That's you";
                } else {
                    btn.title = "Click to mention " + p.name;
                    btn.addEventListener("click", () => { insertMention(p.name); closeDrawers(); });
                }
                li.append(btn);
                usersEl.appendChild(li);
            });
        }

        // ---------- drawers (small screens) ----------
        function closeDrawers() {
            channelsEl.classList.remove("open");
            panel.classList.remove("open");
            scrim.classList.remove("show");
            chanBtn.setAttribute("aria-expanded", "false");
            whoBtn.setAttribute("aria-expanded", "false");
        }

        function toggleDrawer(el, btn) {
            const open = !el.classList.contains("open");
            closeDrawers();
            if (open) {
                el.classList.add("open");
                scrim.classList.add("show");
                btn.setAttribute("aria-expanded", "true");
            }
        }

        chanBtn.addEventListener("click", () => toggleDrawer(channelsEl, chanBtn));
        whoBtn.addEventListener("click", () => toggleDrawer(panel, whoBtn));
        scrim.addEventListener("click", closeDrawers);
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeDrawers();
            // Alt + Up/Down jumps between channels
            if (joined && e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
                e.preventDefault();
                const i = CHANNELS.findIndex((c) => c.id === current);
                const next = CHANNELS[(i + (e.key === "ArrowDown" ? 1 : CHANNELS.length - 1)) % CHANNELS.length];
                switchChannel(next.id);
            }
        });

        // ---------- events ----------
        $("joinForm").addEventListener("submit", (e) => {
            e.preventDefault();
            if (claim) return;
            const name = nameInput.value.trim();
            if (name.length < 2) return showJoinError("Username needs at least 2 characters.");
            if (name.indexOf("|") >= 0) return showJoinError("Usernames can't contain |");
            if (state !== "online") return showJoinError("Not connected yet. Wait for the green dot.");
            startClaim(name);
        });

        function showJoinError(text) {
            joinError.textContent = text;
            joinError.hidden = false;
            nameInput.focus();
        }

        $("chatForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text || !joined) return;
            if (sendPacket("MSG", myId, myName, current + "|" + text)) {
                msgInput.value = "";
                drafts[current] = "";
                cancelTyping();
            }
            msgInput.focus();
        });

        buildChannelList();
        renderChannelHeader();
        updateBadges();
        renderChannel();
        connect();
    </script>
</body>

</html>
